name: Hybrid input and OWL validation

on:
  push:
    branches: [main, "release/**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # CPU CI checks artifacts/OWL, not the GPU model experiment.
      # Keep one dependency file; select its exact OWL pins here.
      - name: Install OWL dependencies from shared requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          names = {"rdflib", "owlready2", "networkx"}
          pins = [line.strip() for line in Path("requirements.txt").read_text().splitlines()
                  if line.split("==")[0].lower() in names]
          assert len(pins) == len(names)
          subprocess.run([sys.executable, "-m", "pip", "install", *pins, "pip-audit==2.10.1"], check=True)
          PY
      - run: python -m pip check
      - run: pip-audit
      - run: python -m unittest discover -s hybrid_multitrade/tests -v
